[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iax2"
dynamic = ["version"]
description = "Pure-Python asyncio implementation of the IAX2 protocol (RFC 5456), interoperable with Asterisk."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jason D. McCormick", email = "jason@mfamily.org" }]
keywords = ["iax", "iax2", "voip", "asterisk", "allstarlink", "telephony", "rfc5456"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Internet Phone",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# RSA authentication and AES-128 call encryption.
crypto = ["cryptography>=3.4"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "mypy", "ruff", "cryptography>=3.4"]
docs = ["sphinx>=5"]

[project.urls]
Homepage = "https://github.com/AllStarLink/py-iax2"
Source = "https://github.com/AllStarLink/py-iax2"
Changelog = "https://github.com/AllStarLink/py-iax2/blob/main/CHANGELOG.md"

[project.scripts]
iax2-tool = "iax2.cli:main"

[tool.hatch.version]
path = "src/iax2/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/iax2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "interop: requires a local Asterisk configured by tests/interop/setup_asterisk.py",
]
addopts = "-m 'not interop'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "RUF002"]  # RUF002: en dashes / × in docstrings are intentional

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/iax2"]
